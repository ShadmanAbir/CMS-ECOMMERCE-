<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 100" fill="none">
  <!-- BAD text - heavy and bold -->
  <text x="30" y="72" font-family="'Bebas Neue', sans-serif" font-size="80" font-weight="900" fill="white" letter-spacing="4">BAD</text>
  
  <!-- Center X/Cross - bolder -->
  <g transform="translate(250, 50)">
    <line x1="-20" y1="-20" x2="20" y2="20" stroke="white" stroke-width="4" stroke-linecap="round"/>
    <line x1="20" y1="-20" x2="-20" y2="20" stroke="white" stroke-width="4" stroke-linecap="round"/>
  </g>
  
  <!-- LAB text - heavy and bold -->
  <text x="290" y="72" font-family="'Bebas Neue', sans-serif" font-size="80" font-weight="900" fill="white" letter-spacing="4">LAB</text>
</svg>
